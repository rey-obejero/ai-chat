name: ai-chat

# Containerized development: the whole stack in Compose, with no reverse proxy.
# The browser talks to the published Vite port and Vite proxies /api to the API,
# so the application stays single-origin without Caddy (ADR-0046).
#
# `just dependencies` starts only the datastores named below and runs the API
# and SPA on the host; `just development-containerized` starts all of it. The
# datastore ports are published here because a host-run API needs to reach them
# — that is a development concern, so it lives in the development file rather
# than in an overlay.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aichat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aichat}
      POSTGRES_DB: ${POSTGRES_DB:-aichat}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *logging

  supertokens:
    # Keep in sync with supertokens-python: SDK 0.31.x requires CDI 5.4,
    # which core advertises from 11.4.4 onward.
    image: registry.supertokens.io/supertokens/supertokens-postgresql:11.4.4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://${POSTGRES_USER:-aichat}:${POSTGRES_PASSWORD:-aichat}@postgres:5432/supertokens
      SUPERTOKENS_API_KEY: ${SUPERTOKENS_API_KEY:-dev-key-change-me}
    ports:
      - "${SUPERTOKENS_PORT:-3567}:3567"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3567/hello"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    # Rate-limit counters only; nothing here needs to survive a restart, so
    # there is no volume (ADR-0020). Published so a host-run API that opts into
    # Redis-backed limiting can reach it.
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *logging

  mailpit:
    # Catches development mail so no message ever leaves the machine (ADR-0030).
    # Both ports are published deliberately: the SMTP port so a host-run API can
    # reach it, and the HTTP API on 8025 so the reset flow is testable and the
    # UI is browsable. This is a dev dependency, not an application service.
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *logging

  migrate:
    # One-shot: without this the API starts cleanly and then 500s on missing
    # tables, which is a confusing failure. `api` waits for it to succeed.
    build:
      context: ../../back-end
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    # The application's own settings — LLM key, OAuth credentials — come from
    # this file, which is also what a host-run API reads. Loading it here is
    # what keeps a secret in one place instead of a copy per runner. Absent is
    # fine: every setting has a default.
    env_file:
      - path: ../../back-end/.env
        required: false
    environment: &api-env
      # Only what differs inside the container. `environment` wins over
      # `env_file`, so these override the host-run values deliberately.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aichat}:${POSTGRES_PASSWORD:-aichat}@postgres:5432/aichat
      SUPERTOKENS_CONNECTION_URI: http://supertokens:3567
      SUPERTOKENS_API_KEY: ${SUPERTOKENS_API_KEY:-dev-key-change-me}
      # Both must be the browser origin (the published Vite port), not the API's
      # own port — SuperTokens derives cookie scope and redirects from these,
      # and they must match or the session cookie becomes cross-site.
      API_BASE_URL: ${DEV_ORIGIN:-http://localhost:5173}
      FRONTEND_URL: ${DEV_ORIGIN:-http://localhost:5173}
      RATE_LIMIT_STORAGE_URI: async+redis://redis:6379/0
      # Mailpit, reachable by service name inside the network; the host-run API
      # uses `localhost` instead, which is why this is set per environment.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM_NAME: AI Chat
      SMTP_FROM_EMAIL: no-reply@localhost
    logging: *logging

  api:
    build:
      context: ../../back-end
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      supertokens:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: ../../back-end/.env
        required: false
    environment: *api-env
    volumes:
      # Source only, so editing a Python file reloads the API. The virtualenv
      # stays in the image.
      - ../../back-end/src:/app/src:ro
      - ../../back-end/alembic:/app/alembic:ro
    command:
      - uvicorn
      - ai_chat.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *logging

  front-end:
    image: node:22-alpine
    working_dir: /app/front-end
    restart: unless-stopped
    # Install from the workspace root, not from front-end/: the
    # onlyBuiltDependencies allowlist that permits esbuild's postinstall lives
    # in the root package.json, and pnpm only reads it there.
    command:
      - sh
      - -c
      - >-
        corepack enable &&
        cd /app &&
        pnpm install --frozen-lockfile &&
        cd front-end &&
        pnpm dev --host 0.0.0.0 --port 5173
    ports:
      # The browser origin for containerized development. Vite proxies /api to
      # the `api` service, so there is still only one origin.
      - "${DEV_PORT:-5173}:5173"
    volumes:
      - ../../:/app
      # Every node_modules the install touches must be a volume, or the
      # container leaves root-owned files in the host's working tree.
      - workspace-modules:/app/node_modules
      - front-end-modules:/app/front-end/node_modules
      - e2e-modules:/app/e2e/node_modules
    environment:
      # CI=true keeps pnpm non-interactive: the container's node_modules is a
      # fresh volume, so pnpm would otherwise stop on a "reinstall from
      # scratch?" prompt and never reach `pnpm dev`.
      CI: "true"
      # HMR needs no configuration: with no `hmr.host` or `clientPort`, Vite
      # derives the socket origin from the client script's own URL, which is
      # the page origin.
      CHOKIDAR_USEPOLLING: "false"
      # Vite runs inside this container, so its proxy target is the API service
      # name rather than `localhost` — which would be this container.
      VITE_API_PROXY_TARGET: http://api:8000
    depends_on:
      - api
    logging: *logging

volumes:
  pgdata:
  workspace-modules:
  front-end-modules:
  e2e-modules:
