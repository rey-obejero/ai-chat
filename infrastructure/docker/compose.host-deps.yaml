# CI and the e2e suite run the API and the SPA on the host, so they need the
# dependencies reachable from outside the compose network. This override
# republishes their ports; the development stack deliberately does not.
#
#   docker compose -f compose.yaml -f compose.host-deps.yaml up -d --wait
services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5433}:5432"

  supertokens:
    ports:
      - "${SUPERTOKENS_PORT:-3567}:3567"