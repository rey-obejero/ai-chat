name: Feature request
description: Propose a capability or a change in behaviour.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you cannot do today, and who it affects. Describe the need rather than the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: The behaviour you would like. If it changes an existing decision, say which one.
    validations:
      required: true
  - type: input
    id: requirement
    attributes:
      label: Related requirement
      description: The requirement identifier from docs/functional-requirements.md, if this touches one (for example FR-17).
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, and why they were rejected. "None" is an acceptable answer.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and ADRs for prior discussion of this.
          required: true
