name: release-please

on:
  push:
    branches: [main]

# release-please writes the CHANGELOG, bumps the version, opens the Release PR,
# tags the commit and creates the GitHub Release. It never deploys.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Reads the Conventional Commits since the last tag and keeps a Release PR
      # open that bumps the version and updates CHANGELOG.md. Merge that PR when
      # you want to cut a release.
      - uses: googleapis/release-please-action@v4
        with:
          # With no PAT, the built-in token still tags and releases, but the
          # Release PR it opens will not trigger other workflows (GitHub
          # suppresses events raised by GITHUB_TOKEN). Set a RELEASE_PLEASE_TOKEN
          # secret — a PAT with `contents` and `pull requests` write — to have CI
          # run on the Release PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
