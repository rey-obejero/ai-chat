name: ci

on:
  push:
  pull_request:

jobs:
  back-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
        working-directory: back-end
      - run: uv run ruff check . && uv run ruff format --check .
        working-directory: back-end
      - run: uv run pytest
        working-directory: back-end

  front-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm eslint . && pnpm exec prettier --check .
        working-directory: front-end
      - run: pnpm test
        working-directory: front-end
      - run: pnpm build
        working-directory: front-end

  e2e:
    runs-on: ubuntu-latest
    env:
      # The core container requires its API key; the SDK default is empty.
      SUPERTOKENS_API_KEY: dev-key-change-me
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # `up --wait` blocks until every service's own healthcheck passes, so the
      # hand-rolled SuperTokens poll this replaces added nothing but a second
      # definition of "ready". Only the datastores start: the e2e suite runs the
      # API and SPA on the host, against the ports the dev file publishes.
      - run: docker compose -f infrastructure/docker/compose.dev.yaml up -d --wait postgres supertokens redis mailpit
      - run: uv sync --frozen
        working-directory: back-end
      - run: uv run alembic upgrade head
        working-directory: back-end
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      # Playwright starts the mock provider, the API, and the SPA itself.
      - run: pnpm test
        working-directory: e2e
      # Keep the evidence for a red run: the HTML report embeds traces and
      # screenshots, and the service logs explain a startup failure.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
      - name: Dump service status and logs
        if: failure()
        run: |
          docker compose -f infrastructure/docker/compose.dev.yaml ps
          docker compose -f infrastructure/docker/compose.dev.yaml logs --no-color

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          # Required by the action to scan pull requests.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
