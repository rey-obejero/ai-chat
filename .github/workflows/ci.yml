name: ci

on:
  push:
  pull_request:

jobs:
  back-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
        working-directory: back-end
      - run: uv run ruff check . && uv run ruff format --check .
        working-directory: back-end
      - run: uv run pytest
        working-directory: back-end

  front-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm eslint . && pnpm exec prettier --check .
        working-directory: front-end
      - run: pnpm test
        working-directory: front-end
      - run: pnpm build
        working-directory: front-end

  e2e:
    runs-on: ubuntu-latest
    env:
      # The core container requires its API key; the SDK default is empty.
      SUPERTOKENS_API_KEY: dev-key-change-me
      # The suite runs entirely in Compose. `SITE_ADDRESS` is the app's origin on
      # the compose network; the host ports are published but unused by the
      # suite (the runner reaches Caddy by service name).
      SITE_ADDRESS: http://caddy
      HTTP_PORT: "18080"
      HTTPS_PORT: "18443"
      COMPOSE_FILES: "-f infrastructure/docker/compose.selfhost.yaml -f infrastructure/docker/compose.e2e.yaml"
    steps:
      - uses: actions/checkout@v4
      - name: Build the stack and the Playwright runner
        run: docker compose -p ai-chat-e2e $COMPOSE_FILES --profile test build
      - name: Start the stack
        run: docker compose -p ai-chat-e2e $COMPOSE_FILES up -d --wait
      - name: Run the end-to-end suite
        run: |
          mkdir -p e2e/test-results e2e/playwright-report
          docker compose -p ai-chat-e2e $COMPOSE_FILES --profile test run --rm e2e
      # Keep the evidence for a red run: the HTML report embeds traces and
      # screenshots, and the service logs explain a startup failure.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
      - name: Dump service status and logs
        if: failure()
        run: |
          docker compose -p ai-chat-e2e $COMPOSE_FILES ps
          docker compose -p ai-chat-e2e $COMPOSE_FILES logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -p ai-chat-e2e $COMPOSE_FILES down -v --remove-orphans

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          # Required by the action to scan pull requests.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
