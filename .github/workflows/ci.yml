name: ci

on:
  push:
  pull_request:

# The tests read the repository and nothing else; grant only that.
permissions:
  contents: read

# A newer push supersedes a run still in flight for the same ref. Release
# plumbing lives in its own workflow so a superseded run can never strand a
# Release PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run ruff check . && uv run ruff format --check .
        working-directory: backend
      - run: uv run mypy
        working-directory: backend
      - run: uv run pytest --cov --cov-report=term-missing
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm eslint . && pnpm exec prettier --check .
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The core container requires its API key; the SDK default is empty.
      SUPERTOKENS_API_KEY: dev-key-change-me
      # The suite runs entirely in Compose. `SITE_ADDRESS` is the app's origin on
      # the compose network; the host ports are published but unused by the
      # suite (the runner reaches Caddy by service name).
      SITE_ADDRESS: http://caddy
      HTTP_PORT: "18080"
      HTTPS_PORT: "18443"
      COMPOSE_FILES: "-f infrastructure/docker/compose.selfhost.yaml -f infrastructure/docker/compose.e2e.yaml"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the stack and the Playwright runner
        run: docker compose -p ai-chat-e2e $COMPOSE_FILES --profile test build
      - name: Start the stack
        run: docker compose -p ai-chat-e2e $COMPOSE_FILES up -d --wait
      - name: Run the end-to-end suite
        run: |
          mkdir -p e2e/test-results e2e/playwright-report
          docker compose -p ai-chat-e2e $COMPOSE_FILES --profile test run --rm e2e
      # Keep the evidence for a red run: the HTML report embeds traces and
      # screenshots, and the service logs explain a startup failure.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
      - name: Dump service status and logs
        if: failure()
        run: |
          docker compose -p ai-chat-e2e $COMPOSE_FILES ps
          docker compose -p ai-chat-e2e $COMPOSE_FILES logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -p ai-chat-e2e $COMPOSE_FILES down -v --remove-orphans

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          # Required by the action to scan pull requests.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
