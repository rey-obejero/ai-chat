name: ai-chat

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aichat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aichat}
      POSTGRES_DB: ${POSTGRES_DB:-aichat}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:3.78
    command: "server -dir=/data -master.volumeSizeLimitMB=1000 -volume.max=0 -s3 -filer"
    ports:
      - "${SEAWEEDFS_S3_PORT:-8333}:8333"
      - "${SEAWEEDFS_FILER_PORT:-8888}:8888"
    volumes:
      - weeddata:/data
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-admin}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-admin}

  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:9.3.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://${POSTGRES_USER:-aichat}:${POSTGRES_PASSWORD:-aichat}@postgres:5432/supertokens
      SUPERTOKENS_API_KEY: ${SUPERTOKENS_API_KEY:-dev-key-change-me}
    ports:
      - "${SUPERTOKENS_PORT:-3567}:3567"

  api:
    build:
      context: ./back-end
    depends_on:
      postgres:
        condition: service_healthy
      supertokens:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://aichat:aichat@postgres:5432/aichat
      SUPERTOKENS_CONNECTION_URI: http://supertokens:3567
      SUPERTOKENS_API_KEY: ${SUPERTOKENS_API_KEY:-dev-key-change-me}
    ports:
      - "${API_PORT:-8000}:8000"

  caddy:
    image: caddy:2-alpine
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # front-end static build served here (populated by `pnpm build` in CI/prod);
      # dev uses `pnpm dev` directly, bypassing Caddy.
      - webdist:/srv/web:ro

volumes:
  pgdata:
  weeddata:
  webdist:
